# SPDX-License-Identifier: MPL-2.0
# SPDX-FileCopyrightText: 2026 Daniel Kressner
#
# REUSE annotations (ADR-0001). Per-file SPDX headers remain in source files;
# this covers generated and data files that cannot carry a comment header.
version = 1

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Daniel Kressner"
SPDX-License-Identifier = "MPL-2.0"

# The public profile and the organization's default security policy are prose
# meant to be quoted, so they are CC0-1.0; `override` replaces the aggregate
# MPL-2.0 annotation for these paths.
[[annotations]]
path = ["org/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Daniel Kressner"
SPDX-License-Identifier = "CC0-1.0"

# The project's non-code assets are CC0-1.0; the icon is copied into the Site
# output as icon.png, so its licence travels with the asset.
[[annotations]]
path = ["docs/assets/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Daniel Kressner"
SPDX-License-Identifier = "CC0-1.0"
