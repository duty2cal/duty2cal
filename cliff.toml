# SPDX-License-Identifier: MPL-2.0
# git-cliff configuration for the change log (design.md "The renderer").
#
# The project owns one configuration; `scripts/render-changelog.sh` always
# passes it explicitly (`--config cliff.toml`), so a render never picks up a
# developer's global configuration and a local render matches CI's.
#
# The pinned generator is git-cliff 2.14.2. Its output shape changes between
# versions and the drift check compares bytes, so the version is part of the
# contract: `scripts/render-changelog.sh` refuses a `git-cliff` whose version
# differs from the one named here. CI installs exactly this version
# (taiki-e/install-action@v2, tool: git-cliff@2.14.2).
# git-cliff version: 2.14.2
#
# The capability allow-list is the use-case ids present as directories under
# `givn/specs/`. A revision whose conventional-commit type carries one of those
# scopes is a released change; so is a dependency update (`chore(deps): …`)
# that changed a path a user receives. Every other revision — housekeeping,
# tests, documentation, CI, tooling and the machinery of building, packaging and
# publishing — is not, and is skipped. The renderer compares this list against
# the corpus and refuses a difference, so a new capability cannot be left out of
# every release quietly. The allow-list is repeated inside each type's parser
# because `git-cliff` groups by the parser a revision matches: one shared
# `field = "scope"` parser cannot separate a new capability from a chore.

[changelog]
# The template renders one section. The heading's date is stamped by the
# renderer, not taken from the generator: `git-cliff`'s release timestamp falls
# back to "now" for a revision it cannot date, and the date must be the released
# revision's own committer date at any time on any machine. The renderer
# replaces the placeholder below with that date.
body = """
## [{% if version %}{{ version | trim_start_matches(pat="v") }}{% else %}unreleased{% endif %}] - @@DATE@@

{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}### {{ entry.group }}
{%- for commit in entry.commits %}
- {{ commit.message | upper_first }}<!--rev:{{ commit.id }}-->
{%- endfor %}

{% endfor -%}
"""
trim = false
render_always = true

[git]
# The capability allow-list, read by the renderer and compared against the
# use-case ids under `givn/specs/`.
# <!-- capability-allow-list: export-duty-plan-calendar publish-public-release publish-public-website adopt-existing-configuration apply-configuration-change measure-distributed-executable-size reduce-distributed-executable-size -->
# The paths a user receives: the converter's crates and command-line
# application, the browser bundle and its WebAssembly FFI, the build inputs that
# decide what the executable contains, and the packaging and the release
# workflow that decide what an archive holds. A released revision is announced
# only when it changed one of them, whatever its subject says; a path listed
# here and missing from the tree stops the render.
# The line between the two kinds of tooling is deliberate: a path whose
# contents decide what a downloader receives, or what those bytes do, belongs
# here; `.github/workflows/ci.yml`, `scripts/render-changelog.sh`, `cliff.toml`,
# `docs/`, `givn/` and test code decide only how the project works on what it
# ships. `scripts/prepare-release.sh` and the release workflow are listed
# because they decide what an archive holds and its file mode.
# <!-- user-receiving-paths: crates/ apps/cli/src/ web/ ffi/wasm/ Cargo.toml Cargo.lock rust-toolchain.toml .cargo/ scripts/prepare-release.sh .github/workflows/release.yml -->
conventional_commits = true
filter_unconventional = true
# Keep a breaking revision even when its type is not listed below: a breaking
# change is visible to a user whatever the type it carries.
protect_breaking_commits = true

commit_preprocessors = [
  # `git-cliff`'s conventional parser does not know `revert`; marking the type
  # lets the `^revert` parser below reach it.
  { pattern = "(?m)^revert", replace = "xrevert" },
]

commit_parsers = [
  # The project's own machinery, even when a revision carries a capability
  # scope: a revision whose words name a tool, a workflow, a check, a test, a
  # document or the machinery of building, packaging and publishing is not a
  # change a reader can act on. Each term is a distinctive phrase that names
  # that tooling rather than a bare common word, so a subject that merely
  # borrows the word for a crew member's own work ("Support the crew's ramp
  # workflow", "Handle notices from the roster") stays a released change. A
  # term is a comma-separated phrase; `scripts/render-changelog.sh` reads the
  # marked list below and refuses a term it cannot find realized here.
  # <!-- machinery-skip-list: coverage report, coverage merge, cobertura, clippy, rustfmt, third-party notices, ci workflow, release workflow, e2e transcript -->
  # Each pattern is anchored at the start of the message and `.` never crosses a
  # newline, so the terms are matched against the revision's subject only: a
  # body that happens to discuss the tooling must not silence a released change.
  { message = "(?i)^.*coverage report", skip = true },
  { message = "(?i)^.*coverage merge", skip = true },
  { message = "(?i)^.*cobertura", skip = true },
  { message = "(?i)^.*clippy", skip = true },
  { message = "(?i)^.*rustfmt", skip = true },
  { message = "(?i)^.*third-party notices", skip = true },
  { message = "(?i)^.*ci workflow", skip = true },
  { message = "(?i)^.*release workflow", skip = true },
  { message = "(?i)^.*e2e transcript", skip = true },

  # Breaking changes first: a reader looks for what may stop working before
  # what is new.
  { message = "^feat\\(export-duty-plan-calendar\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat\\(publish-public-release\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat\\(adopt-existing-configuration\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^fix\\(export-duty-plan-calendar\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^fix\\(publish-public-release\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^fix\\(adopt-existing-configuration\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^perf\\(export-duty-plan-calendar\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^perf\\(publish-public-release\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^perf\\(adopt-existing-configuration\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^xrevert\\(export-duty-plan-calendar\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^xrevert\\(publish-public-release\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^xrevert\\(adopt-existing-configuration\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat\\(measure-distributed-executable-size\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^fix\\(measure-distributed-executable-size\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^perf\\(measure-distributed-executable-size\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^xrevert\\(measure-distributed-executable-size\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat\\(reduce-distributed-executable-size\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^fix\\(reduce-distributed-executable-size\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^perf\\(reduce-distributed-executable-size\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^xrevert\\(reduce-distributed-executable-size\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat\\(publish-public-website\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^fix\\(publish-public-website\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^perf\\(publish-public-website\\)!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^xrevert\\(publish-public-website\\)!:", group = "<!-- 0 -->Breaking changes" },

  # A new capability: a feature whose scope is a capability the repository
  # holds.
  { message = "^feat\\(export-duty-plan-calendar\\):", group = "<!-- 1 -->New capabilities" },
  { message = "^feat\\(publish-public-release\\):", group = "<!-- 1 -->New capabilities" },
  { message = "^feat\\(adopt-existing-configuration\\):", group = "<!-- 1 -->New capabilities" },
  { message = "^feat\\(measure-distributed-executable-size\\):", group = "<!-- 1 -->New capabilities" },
  { message = "^feat\\(reduce-distributed-executable-size\\):", group = "<!-- 1 -->New capabilities" },
  { message = "^feat\\(publish-public-website\\):", group = "<!-- 1 -->New capabilities" },

  # Fixes.
  { message = "^fix\\(export-duty-plan-calendar\\):", group = "<!-- 2 -->Fixes" },
  { message = "^fix\\(publish-public-release\\):", group = "<!-- 2 -->Fixes" },
  { message = "^fix\\(adopt-existing-configuration\\):", group = "<!-- 2 -->Fixes" },
  { message = "^fix\\(measure-distributed-executable-size\\):", group = "<!-- 2 -->Fixes" },
  { message = "^fix\\(reduce-distributed-executable-size\\):", group = "<!-- 2 -->Fixes" },
  { message = "^fix\\(publish-public-website\\):", group = "<!-- 2 -->Fixes" },

  # Performance.
  { message = "^perf\\(export-duty-plan-calendar\\):", group = "<!-- 3 -->Performance" },
  { message = "^perf\\(publish-public-release\\):", group = "<!-- 3 -->Performance" },
  { message = "^perf\\(adopt-existing-configuration\\):", group = "<!-- 3 -->Performance" },
  { message = "^perf\\(measure-distributed-executable-size\\):", group = "<!-- 3 -->Performance" },
  { message = "^perf\\(reduce-distributed-executable-size\\):", group = "<!-- 3 -->Performance" },
  { message = "^perf\\(publish-public-website\\):", group = "<!-- 3 -->Performance" },

  # Reversals.
  { message = "^xrevert\\(export-duty-plan-calendar\\):", group = "<!-- 4 -->Reversals" },
  { message = "^xrevert\\(publish-public-release\\):", group = "<!-- 4 -->Reversals" },
  { message = "^xrevert\\(adopt-existing-configuration\\):", group = "<!-- 4 -->Reversals" },
  { message = "^xrevert\\(measure-distributed-executable-size\\):", group = "<!-- 4 -->Reversals" },
  { message = "^xrevert\\(reduce-distributed-executable-size\\):", group = "<!-- 4 -->Reversals" },
  { message = "^xrevert\\(publish-public-website\\):", group = "<!-- 4 -->Reversals" },

  # Dependency updates a user receives: Dependabot's `chore(deps):` bump
  # changes the dependency graph, which is a user-receiving path, so the entry
  # survives the renderer's path filter. A bump that changed only the project's
  # checks does not survive it; a bump to the release workflow does.
  { message = "^chore\\(deps\\):", group = "<!-- 5 -->Dependencies" },

  # Everything else is not a change a user can see: housekeeping other than a
  # dependency update, tests, documentation, CI, tooling, and any scope outside
  # the allow-list — the machinery of building, packaging and publishing among
  # them.
  { message = ".*", skip = true },
]
