# SPDX-License-Identifier: MPL-2.0
# The whole workspace is MPL-2.0, project-wide (see
# docs/arc42/adr/ADR-0001-project-license.md).
[workspace]
resolver = "2"
members = [
  "crates/duty2cal-core",
  "crates/duty2cal-pdf",
  "apps/cli",
  "ffi/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

# Small single executable (see design.md "Distribution notes").
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
# Measured lever: 83,968 B smaller on the supported platform; a panic aborts
# instead of unwinding (see the reduce-executable-size change).
panic = "abort"
