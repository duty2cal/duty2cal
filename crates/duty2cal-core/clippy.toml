# Clippy guardrails for the pure core: no I/O, no clock, no environment.
# Violations fail CI via `cargo clippy --workspace -- -D warnings`.
disallowed-types = [
    "std::fs::File",
    "std::net::TcpStream",
    "std::net::UdpSocket",
    "std::time::SystemTime",
    "std::time::Instant",
]
disallowed-methods = [
    "std::fs::read",
    "std::fs::write",
    "std::fs::read_to_string",
    "std::env::var",
    "std::env::args",
    "std::process::exit",
]
