# SPDX-License-Identifier: MPL-2.0
[package]
name = "duty2cal-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
duty2cal-core = { path = "../duty2cal-core" }
# FlateDecode only; the file structure and the interpretation are project code
# in `src/reader`.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
time = "0.3"

[dev-dependencies]
# Test oracle only; never part of a shipped graph.
pdfplumber = "=0.4.1"
duty2cal-pdf-fixtures = { path = "../duty2cal-pdf-fixtures" }
