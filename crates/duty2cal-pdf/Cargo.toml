[package]
name = "duty2cal-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
duty2cal-core = { path = "../duty2cal-core" }
# The file-structure layer only; the interpretation is project code in `src/reader`.
lopdf = { version = "=0.46.0", default-features = false }
time = "0.3"

[dev-dependencies]
# Test oracle only; never part of a shipped graph.
pdfplumber = "=0.4.1"
duty2cal-pdf-fixtures = { path = "../duty2cal-pdf-fixtures" }
