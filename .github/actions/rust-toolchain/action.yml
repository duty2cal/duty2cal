# SPDX-License-Identifier: MPL-2.0
name: rust toolchain
description: Install the toolchain pinned in rust-toolchain.toml
runs:
  using: composite
  steps:
    - name: Ensure rustup
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          printf '%s\n' "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
        fi

    - name: Install the pinned toolchain, components and targets
      shell: bash
      run: |
        set -euo pipefail
        rustup show

    - name: Assert the pinned toolchain, components and LLVM tools
      shell: bash
      run: |
        set -euo pipefail
        scripts/check-toolchain.sh
        cargo fmt --version
        cargo clippy --version
