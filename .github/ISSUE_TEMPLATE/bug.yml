# SPDX-License-Identifier: MPL-2.0
name: Bug report
description: A conversion, diagnostic or release defect in duty2cal
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        duty2cal converts a Lufthansa cabin-crew duty plan published as a
        Jeppesen PDF export into one calendar file. One roster month of cabin
        crew; not cockpit duties, other Lufthansa duty plans, other Jeppesen
        exports or another operator. Not affiliated with Lufthansa, Jeppesen,
        or any duty-plan provider or airline.

        **Never attach a real duty plan, a calendar converted from one, or a
        personal itinerary.** A sample has to be stripped first: the page
        structure with every real name, employee number, date, station and route
        removed or replaced. A defect that could expose private plan data does
        not belong in a public issue — see [SECURITY.md](../SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: The released version (for example 0.1.0) or the commit you built from.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which archive or build did you run?
      options:
        - Windows x86_64
        - built from source
    validations:
      required: true
  - type: dropdown
    id: converted
    attributes:
      label: Did the plan convert?
      options:
        - "yes"
        - "no"
    validations:
      required: true
  - type: textarea
    id: refusal
    attributes:
      label: What did the refusal say?
      description: The exact diagnostic text and the process exit status, if you have them. Leave empty if the plan converted.
    validations:
      required: false
  - type: textarea
    id: dates
    attributes:
      label: The month the plan covers
      description: Which roster month or date range does the plan cover? Do not paste the plan itself.
      placeholder: the roster month
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Stripped sample
      description: If a sample is needed, supply a stripped one. Never the real plan.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real duty plan, no calendar converted from one, and no personal identifying values.
          required: true
