# SPDX-License-Identifier: MPL-2.0
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Every check here only reads the repository. Stated explicitly rather than
# inherited, so a changed repository default cannot widen it and the requirement
# is visible in the file (CodeQL actions/missing-workflow-permissions; the
# artifact uploads use the run's own token, not this one).
permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Check that the test graph keeps the oracle
        run: scripts/check-extraction-dependency.sh --dev --package duty2cal-pdf
      # The product suite: core/PDF unit and property tests, the architecture
      # tests, the golden calendar test, and the conversion scenarios. The
      # operational features are @documentation and are skipped by the
      # assembler; the browser scenarios run in the `browser` job.
      - name: Run the product suite
        env:
          DUTY2CAL_TRANSCRIPT_PATH: ${{ runner.temp }}/test-transcript.log
        run: ./run-tests.sh
      - name: Surface the failing scenarios
        if: failure()
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/test-transcript.log"
          [ -f "$log" ] || exit 0
          awk '
            /^  Scenario:/ { scenario = $0 }
            /Step panicked\. Captured output:/ {
              message = $0
              getline; message = message " | " $0
              getline; message = message " | " $0
              print scenario " :: " message
            }
          ' "$log" | head -20 | while IFS= read -r line; do
            echo "::error title=CI failure::${line#  Scenario: }"
          done
      - name: Append the phase timings
        if: always()
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/test-transcript.log"
          [ -f "$log" ] || exit 0
          grep '^phase=' "$log" >> "$GITHUB_STEP_SUMMARY" || true

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # `scripts/build-site.sh` stamps the footer with `git describe`.
          fetch-depth: 0
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/e2e/.nvmrc
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json
      - run: npm ci --prefix web/e2e
      - run: npx --prefix web/e2e playwright install --with-deps chromium
      - name: Resolve the comparison base
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          else
            git fetch origin main
            base="$(git merge-base HEAD origin/main)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Check that the browser graph carries no extractor
        run: scripts/check-extraction-dependency.sh --normal --target wasm32-unknown-unknown
      # The browser scenarios, each run by name so a failing one names itself.
      - name: Run the browser smoke
        run: ./run-tests.sh --browser --name "Crew member converts a supported duty plan in the browser and saves the offered calendar"
      - name: Run the Impressum browser scenario
        run: ./run-tests.sh --browser --name "Reader opens the Impressum from the site footer and reads who publishes the site"
      - name: Run the Datenschutzerklärung browser scenario
        run: ./run-tests.sh --browser --name "Reader opens the Datenschutzerklärung from the footer and reads what a page request processes"
      - name: Measure the browser bundle against the same revision
        run: |
          python3 scripts/measure_browser_bundle.py \
            --repo . \
            --base "${{ steps.base.outputs.sha }}" \
            --out browser-bundle
      - name: Append the bundle measurement
        if: always()
        run: |
          set -euo pipefail
          [ -f browser-bundle/browser-bundle.md ] || exit 0
          cat browser-bundle/browser-bundle.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-bundle
          path: browser-bundle/

  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The drift check renders the released version's range, which needs
          # the full history and every v* tag; the shallow default has neither,
          # so the range would be empty and the comparison meaningless.
          fetch-depth: 0
      # Pinned to the version that produced the committed file: this gate
      # compares generated bytes, so the tool version is part of the contract.
      - uses: ./.github/actions/install-dev-tools
        with:
          tools: git-cliff
      - name: Refuse a committed change log that differs from a fresh render
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 --match 'v*')"
          scripts/render-changelog.sh \
            --version "${tag#v}" --repo . --out CHANGELOG.md --check

  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-dev-tools
        with:
          tools: cargo-deny
      - run: cargo deny check

  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: pipx install reuse
      - run: reuse lint

  license-headers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/license-headers.sh

  pii-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/pii-guard.sh

  notices:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      # Pinned to the version that produced the committed file: cargo-about's
      # output shape changes between versions (0.9.2 duplicates a licence
      # section per crate instead of grouping them), and this gate compares
      # bytes, so the tool version is part of the contract.
      - uses: ./.github/actions/install-dev-tools
        with:
          tools: cargo-about
      - run: cargo about generate about.hbs --output-file THIRD-PARTY-NOTICES.md
      - run: git diff --exit-code THIRD-PARTY-NOTICES.md

  coverage:
    # Coverage is a main-branch measurement, not a per-pull-request cost.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-dev-tools
        with:
          tools: cargo-llvm-cov
      - run: ./measure-coverage.sh
      - run: ./merge-coverages.sh
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  nix:
    # The flake is the Nix machine's route; CI must exercise it, not only the
    # rustup route. The first run resolves the pinned toolchain and builds
    # cargo-llvm-cov once; later runs reuse the store.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Cache the Nix store so the pinned toolchain and the built
      # cargo-llvm-cov are restored instead of rebuilt. No purge: the job keeps
      # `contents: read`, and GitHub's cache eviction bounds old entries.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
      - name: Assert the pinned toolchain, components and LLVM tools
        run: |
          nix develop -c bash -c '
            set -euo pipefail
            scripts/check-toolchain.sh
            rustc -V
            cargo fmt --version
            cargo clippy --version
            scripts/check-playwright-version.sh
          '

  scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Test the publication's early refusals
        run: bats scripts/tests

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check every workflow definition with actionlint
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.12 \
            -color \
            .github/workflows/ci.yml \
            .github/workflows/nightly.yml \
            .github/workflows/release.yml \
            .github/workflows/site.yml \
            .github/workflows/web.yml

  dco:
    # Pull requests only: the requirement is that a contribution carries its
    # sign-off; a direct push by the maintainer is not a contribution.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every revision in the pull request carries a sign-off
        run: |
          bash scripts/dco-check.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  public-text:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/public-text-check.sh

  windows-gnu-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Resolve the comparison base
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          else
            git fetch origin main
            base="$(git merge-base HEAD origin/main)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Check that the Windows graph carries no extractor
        run: scripts/check-extraction-dependency.sh --normal --target x86_64-pc-windows-gnu
      - name: Measure the extraction backend against the same revision
        run: |
          python3 scripts/measure_extraction_backend.py \
            --repo . \
            --base "${{ steps.base.outputs.sha }}" \
            --landed target/x86_64-pc-windows-gnu/release/duty2cal.exe \
            --out extraction-backend
      - name: Append the extraction-backend measurement
        if: always()
        run: |
          set -euo pipefail
          [ -f extraction-backend/extraction-backend.md ] || exit 0
          cat extraction-backend/extraction-backend.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extraction-backend
          path: extraction-backend/
      - name: Assert no companion DLLs are required
        run: |
          set -euo pipefail
          imports=$(x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/duty2cal.exe \
            | awk '/DLL Name/ {print $3}' | sort -u)
          echo "$imports"
          if echo "$imports" | grep -viE '^(kernel32|user32|advapi32|ntdll|msvcrt|api-ms-win-.*|ucrtbase|bcrypt|bcryptprimitives|ws2_32|shell32|ole32|oleaut32|combase|powrprof|secur32|crypt32|iphlpapi|userenv|dbghelp)\.dll$'; then
            echo "unexpected non-system DLL import — the executable is not self-contained";
            exit 1;
          fi
      - name: Install the attribution generator
        uses: ./.github/actions/install-dev-tools
        with:
          tools: cargo-bloat
      - name: Produce the size attribution for this revision
        run: |
          set +e
          python3 scripts/measure_executable_size.py \
            --revision "$GITHUB_SHA" \
            --executable target/x86_64-pc-windows-gnu/release/duty2cal.exe \
            --out size-attribution
          status=$?
          {
            echo '### Size attribution'
            echo ''
            echo "measurement exit status: $status"
            echo ''
            if [ -f size-attribution/attribution.md ]; then
              cat size-attribution/attribution.md
            else
              echo 'no attribution.md was written; see the step log'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: size-attribution
          path: size-attribution/
      - name: Enforce the executable size budget
        run: |
          set -euo pipefail
          executable=target/x86_64-pc-windows-gnu/release/duty2cal.exe
          budget=2097152
          size=$(stat -c '%s' "$executable")
          echo "duty2cal.exe: ${size} B (budget ${budget} B)"
          if [ "$size" -gt "$budget" ]; then
            echo "::error title=Size budget exceeded::duty2cal.exe is ${size} B; the budget is ${budget} B"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: duty2cal-windows-gnu
          path: target/x86_64-pc-windows-gnu/release/duty2cal.exe

  windows-smoke:
    needs: [windows-gnu-build]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: duty2cal-windows-gnu
      - name: The executable starts and reports usage without arguments
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\duty2cal.exe -Wait -PassThru -RedirectStandardError err.txt
          Get-Content err.txt
          if ($p.ExitCode -eq 0) { throw "expected a non-zero exit for a missing argument" }
