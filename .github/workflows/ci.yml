# SPDX-License-Identifier: MPL-2.0
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Every check here only reads the repository. Stated explicitly rather than
# inherited, so a changed repository default cannot widen it and the requirement
# is visible in the file (CodeQL actions/missing-workflow-permissions; the
# artifact uploads use the run's own token, not this one).
permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    # The manual dispatch runs `givn archive` after the suite and pushes the
    # archive revision. Normal push and pull-request runs only read.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The permanent preparation scenario drives scripts/prepare-release.sh,
          # which checks the repository's own committed change log against the
          # released tag. The shallow default has neither the tag nor the
          # history to render it from, so the check would refuse for the wrong
          # reason.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `scripts/build-web.sh` builds the browser bundle in both suite
          # modes; the size-attribution scenarios cross-build for Windows.
          targets: wasm32-unknown-unknown,x86_64-pc-windows-gnu
      # The browser scenarios drive the real page with the pinned Playwright
      # and Chromium (web/e2e/.nvmrc is the reviewed Node version).
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/e2e/.nvmrc
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json
      - run: npm ci --prefix web/e2e
      - run: npx --prefix web/e2e playwright install --with-deps chromium
      # The size-attribution scenarios drive the real measurement command,
      # whose two builds need the Windows cross toolchain and the pinned
      # generator.
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: cargo install --locked cargo-bloat@0.12.1
      # The suite's change-log scenarios drive scripts/render-changelog.sh as a
      # real subprocess, so the pinned generator must be on PATH — the same
      # version the committed CHANGELOG.md was produced with.
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      # The infrastructure scenarios drive the real `tofu` binary, so the
      # pinned version is part of the test contract, not whatever the runner
      # resolves (design.md "Technology decisions").
      - name: Read the pinned OpenTofu version
        id: tofu_version
        run: echo "version=$(cat infra/.opentofu-version)" >> "$GITHUB_OUTPUT"
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ steps.tofu_version.outputs.version }}
      # Mirror the locked provider and write the terraformrc, so `tofu init`
      # inside the adoption command resolves offline (design.md "Provider
      # installation for tests").
      - run: ./scripts/setup-infra-tests.sh
      # The Gherkin runner takes exactly one feature root, which
      # ./run-tests.sh assembles from the permanent corpus and the archived
      # change specs; a bare `cargo test` leaves it looking for
      # tests/features, which does not exist.
      - run: ./run-tests.sh
      # The manual dispatch archives the change after the same suite has
      # passed, in the environment that carries the Windows cross toolchain,
      # Playwright and the pinned generators. `givn archive` runs the gate and
      # merges the delta specs; the revision is pushed so the archive is
      # durable.
      # givn is not published on crates.io; it is built from the private
      # source repository at the revision that produced 0.9.2. The token is
      # supplied by the GIVN_SOURCE_TOKEN repository secret and only used to
      # clone that repository.
      - name: Install the pinned givn
        if: github.event_name == 'workflow_dispatch'
        env:
          GIVN_SOURCE_TOKEN: ${{ secrets.GIVN_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          rewrite="url.https://x-access-token:${GIVN_SOURCE_TOKEN}@github.com/"
          trap 'git config --global --remove-section "${rewrite}" || true' EXIT
          git config --global "${rewrite}.insteadOf" "https://github.com/"
          cargo install --locked --git https://github.com/buster/givn givn \
            --rev 45e9e6d53f52c44d35b0e24ec82d1d6d294d488d
      - name: Record the change verification
        if: github.event_name == 'workflow_dispatch'
        run: givn check tasks --change publish-site-plumbing
      - name: Install the coverage tool
        if: github.event_name == 'workflow_dispatch'
        run: cargo install cargo-llvm-cov --locked
      - name: Archive the completed change
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          givn archive --change publish-site-plumbing
          git push origin "HEAD:${GITHUB_REF_NAME}"

  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The drift check renders the released version's range, which needs
          # the full history and every v* tag; the shallow default has neither,
          # so the range would be empty and the comparison meaningless.
          fetch-depth: 0
      # Pinned to the version that produced the committed file: this gate
      # compares generated bytes, so the tool version is part of the contract.
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      - name: Refuse a committed change log that differs from a fresh render
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 --match 'v*')"
          scripts/render-changelog.sh \
            --version "${tag#v}" --repo . --out CHANGELOG.md --check

  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: pipx install reuse
      - run: reuse lint

  license-headers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/license-headers.sh

  pii-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/pii-guard.sh

  notices:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Pinned to the version that produced the committed file: cargo-about's
      # output shape changes between versions (0.9.2 duplicates a licence
      # section per crate instead of grouping them), and this gate compares
      # bytes, so the tool version is part of the contract.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.0
      - run: cargo about generate about.hbs --output-file THIRD-PARTY-NOTICES.md
      - run: git diff --exit-code THIRD-PARTY-NOTICES.md

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown
      # `measure-coverage.sh` builds the browser bundle and runs the browser
      # scenarios, so the coverage job needs the same Node and Chromium setup.
      # The @nested-build scenarios are outside the coverage profiles.
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/e2e/.nvmrc
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json
      - run: npm ci --prefix web/e2e
      - run: npx --prefix web/e2e playwright install --with-deps chromium
      - run: cargo install cargo-llvm-cov --locked
      - run: ./measure-coverage.sh
      - run: ./merge-coverages.sh
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check every workflow definition with actionlint
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.12 \
            -color .github/workflows/*.yml

  dco:
    # Pull requests only: the requirement is that a contribution carries its
    # sign-off; a direct push by the maintainer is not a contribution.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every revision in the pull request carries a sign-off
        run: |
          bash scripts/dco-check.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  public-text:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/public-text-check.sh

  windows-gnu-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Assert no companion DLLs are required
        run: |
          set -euo pipefail
          imports=$(x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/duty2cal.exe \
            | awk '/DLL Name/ {print $3}' | sort -u)
          echo "$imports"
          if echo "$imports" | grep -viE '^(kernel32|user32|advapi32|ntdll|msvcrt|api-ms-win-.*|ucrtbase|bcrypt|bcryptprimitives|ws2_32|shell32|ole32|oleaut32|combase|powrprof|secur32|crypt32|iphlpapi|userenv|dbghelp)\.dll$'; then
            echo "unexpected non-system DLL import — the executable is not self-contained";
            exit 1;
          fi
      - name: Install the attribution generator
        run: cargo install --locked cargo-bloat@0.12.1
      - name: Produce the size attribution for this revision
        run: |
          set +e
          python3 scripts/measure_executable_size.py \
            --revision "$GITHUB_SHA" \
            --executable target/x86_64-pc-windows-gnu/release/duty2cal.exe \
            --out size-attribution
          status=$?
          {
            echo '### Size attribution'
            echo ''
            echo "measurement exit status: $status"
            echo ''
            if [ -f size-attribution/attribution.md ]; then
              cat size-attribution/attribution.md
            else
              echo 'no attribution.md was written; see the step log'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: size-attribution
          path: size-attribution/
      - uses: actions/upload-artifact@v7
        with:
          name: duty2cal-windows-gnu
          path: target/x86_64-pc-windows-gnu/release/duty2cal.exe

  windows-smoke:
    needs: [windows-gnu-build]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: duty2cal-windows-gnu
      - name: The executable starts and reports usage without arguments
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\duty2cal.exe -Wait -PassThru -RedirectStandardError err.txt
          Get-Content err.txt
          if ($p.ExitCode -eq 0) { throw "expected a non-zero exit for a missing argument" }
