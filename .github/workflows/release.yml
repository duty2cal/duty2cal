# SPDX-License-Identifier: MPL-2.0
name: release

on:
  push:
    tags: ["v*"]

# One release per tag: a tag's release runs to completion on its own.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Windows executable is cross-built on Linux (the confirmed
          # distribution constraint) and started by the smoke-windows job. It
          # is the only platform the project distributes.
          - platform: windows-x86_64
            runner: ubuntu-latest
            target: x86_64-pc-windows-gnu
            binary: duty2cal.exe
            apt: mingw-w64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the linker this target needs
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build the release executable
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  smoke-windows:
    name: smoke (windows-x86_64)
    needs: [build]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binary-windows-x86_64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: The executable starts and reports usage without arguments
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\duty2cal.exe -Wait -PassThru -RedirectStandardError err.txt
          Get-Content err.txt
          if ($p.ExitCode -eq 0) { throw "expected a non-zero exit for a missing argument" }
          if (-not ((Get-Content err.txt -Raw) -match [regex]::Escape("usage: duty2cal <duty-plan.pdf>"))) {
            throw "the executable did not print its usage line"
          }
      - name: Assert no companion DLLs are required
        shell: pwsh
        run: |
          $sysroot = rustc --print sysroot
          $objdump = Get-ChildItem "$sysroot\lib\rustlib\*\bin\llvm-objdump.exe" | Select-Object -First 1
          if (-not $objdump) { throw "llvm-objdump was not found in the toolchain" }
          $imports = & $objdump.FullName -p .\duty2cal.exe | Select-String -Pattern 'DLL Name:' | ForEach-Object { ($_.Line -split '\s+')[-1] } | Sort-Object -Unique
          $imports
          $allowed = '^(kernel32|user32|advapi32|ntdll|msvcrt|api-ms-win-.*|ucrtbase|bcrypt|bcryptprimitives|ws2_32|shell32|ole32|oleaut32|combase|powrprof|secur32|crypt32|iphlpapi|userenv|dbghelp)\.dll$'
          $unexpected = $imports | Where-Object { $_ -notmatch $allowed }
          if ($unexpected) {
            throw "unexpected non-system DLL import - the executable is not self-contained: $($unexpected -join ', ')"
          }

  prepare:
    name: prepare
    needs: [build, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # prepare-release.sh reads the release text and the change log from
          # the tag's history.
          fetch-depth: 0
      # The preparation renders both files with the pinned generator, so it
      # must be on PATH.
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: artifacts
      - name: Lay the built executables out for the preparation
        run: |
          set -euo pipefail
          # With one artifact, actions/download-artifact@v8 extracts its files
          # into the download root rather than a per-artifact directory, so
          # locate the executable instead of assuming either layout.
          exe="$(find artifacts -type f -name 'duty2cal.exe' -print -quit)"
          if [ -z "$exe" ]; then
            echo "the downloaded artifacts hold no duty2cal.exe" >&2
            find artifacts -type f | sort >&2
            exit 1
          fi
          mkdir -p binaries/windows-x86_64
          cp "$exe" binaries/windows-x86_64/duty2cal.exe
          find binaries -type f | sort
      - name: Prepare the release for the tag's version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_ENV"
          scripts/prepare-release.sh --version "$version" --binaries binaries --out staged | tee transcript.txt
          {
            echo "## Release preparation for v${version}"
            echo
            echo '```'
            cat transcript.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.version }}
          path: staged/
          if-no-files-found: error

  site:
    name: site
    # A bare call to the one build-and-deploy definition. A tag publication
    # always builds (no `since`), so the footer names the tag and the release
    # announces the page of its own revision.
    permissions:
      contents: read
    uses: ./.github/workflows/site.yml
    with:
      revision: ${{ github.ref_name }}
    secrets:
      PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}

  publish:
    name: publish
    needs: [prepare, site]
    runs-on: ubuntu-latest
    permissions:
      # Write the release; read this run's own check suite; attest the archives.
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # `git describe` and the target's history must be readable: the
          # publication verifies the hosting target against the tag.
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: duty2cal/duty2cal.github.io
          path: site-target
          fetch-depth: 0
      - name: Wait for every check on the tagged revision to conclude green
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Every release-workflow suite on this revision is excluded, not only
          # this run's suite: a retagged unpublished version can still carry an
          # earlier release run's failed publish check.
          releases="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/release.yml") | .check_suite_id' \
            | sort -u)"
          exclude=()
          while IFS= read -r id; do
            [ -n "$id" ] && exclude+=(--exclude-suite "$id")
          done <<< "$releases"
          scripts/await-green-checks.sh \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            "${exclude[@]}" \
            --interval 15 \
            --timeout 1800
      - name: Remember the tag's version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ env.version }}
          path: staged
      - name: List the inspected staged set
        run: |
          set -euo pipefail
          find staged -maxdepth 1 -type f | sort
      - name: Make the bill-of-materials directory
        run: mkdir -p sbom
      - name: Generate the bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          # A directory that must exist first: the action writes the file but
          # does not create its parents, which is where the first release run
          # failed.
          output-file: sbom/duty2cal-${{ env.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the build provenance of every archive
        uses: actions/attest@v4
        with:
          subject-path: staged/duty2cal-${{ env.version }}-*.tar.gz
      - name: Attest the bill of materials of every archive
        uses: actions/attest@v4
        with:
          subject-path: staged/duty2cal-${{ env.version }}-*.tar.gz
          sbom-path: sbom/duty2cal-${{ env.version }}.spdx.json
      - name: Verify the hosting target and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/publish-release.sh \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "$GITHUB_REF_NAME" \
            --staged staged \
            --repo "$GITHUB_REPOSITORY" \
            --site-repo site-target \
            --target https://github.com/duty2cal/duty2cal.github.io.git

  verify:
    name: verify
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Remember the tag's version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ env.version }}
          path: staged
      - name: Download the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir published
          find published -type f | sort
      - name: Compare the published asset set with the staged set
        run: |
          set -euo pipefail
          gh_assets="$(find published -maxdepth 1 -type f -printf '%f\n' | sort)"
          staged_assets="$(find staged -maxdepth 1 -type f -printf '%f\n' | grep -v '^release-notes\.md$' | sort)"
          if [ "$gh_assets" != "$staged_assets" ]; then
            echo "the published asset set differs from the staged set"
            diff -u <(printf '%s\n' "$staged_assets") <(printf '%s\n' "$gh_assets") || true
            exit 1
          fi
          echo "the published asset set matches the staged set"
      - name: Verify each published checksum against the staged set
        run: |
          set -euo pipefail
          for checksum in staged/*.tar.gz.sha256; do
            name="$(basename "$checksum")"
            cmp "$checksum" "published/${name}"
          done
          echo "every published checksum is the staged checksum"
      - name: Verify every published archive against its checksum
        run: |
          set -euo pipefail
          cd published
          sha256sum --check ./*.tar.gz.sha256
      - name: Verify the build provenance and the bill of materials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for archive in published/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done
      - name: Assert the release reports immutable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.immutable')"
            echo "attempt ${attempt}: immutable=${immutable}"
            if [ "$immutable" = "true" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "the published release does not report immutable: true"
          exit 1
