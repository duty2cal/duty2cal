# SPDX-License-Identifier: MPL-2.0
name: web

# The trigger workflow (design.md "The workflow triggers"): every
# default-branch push starts a run and the command decides whether the revision
# changes a site input. There is no `paths:` filter — that would be a second
# copy of the site-input list — and no `v*` tag trigger: a tag reaches the site
# through the release workflow, which is the only caller that publishes one.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: The revision to publish; the dispatched ref when empty.
        type: string
        required: false
      since:
        description: The base revision whose diff decides whether to publish.
        type: string
        required: false

permissions:
  contents: read

jobs:
  tagged:
    name: tagged
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tagged: ${{ steps.tags.outputs.tagged }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag has to be visible in the checkout, and `fetch-depth: 0`
          # fetches every tag with the history.
          fetch-depth: 0
      - id: tags
        name: Ask whether the pushed revision carries a version tag
        run: |
          set -euo pipefail
          # A revision that a version tag names is published by the release
          # workflow. Starting this publication too would put two runs of the
          # one `site-publication` group on the same revision, and GitHub
          # cancels a run that is still pending in a group when a newer run
          # enters it: the cancellation leaves a `site / publish` check the
          # release's publication gate refuses. Publishing it once keeps the
          # group uncontended and the check set green.
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "the revision carries a version tag: the release workflow publishes it"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "the revision carries no version tag: this workflow publishes it"
          fi

  site:
    name: site
    needs: [tagged]
    if: needs.tagged.outputs.tagged != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/site.yml
    # `github.event.before` is the pushed revision's base. An all-zero base (a
    # first push or an unknown one) and a manual dispatch fall back to the
    # optional `since`, which an empty value turns into a publication that
    # always builds.
    with:
      revision: ${{ inputs.revision }}
      since: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || inputs.since }}
    secrets:
      PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
