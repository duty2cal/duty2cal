# SPDX-License-Identifier: MPL-2.0
[package]
name = "duty2cal-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `cdylib` is the browser artifact; `rlib` lets the native workspace builds
# lint the crate without a wasm target.
crate-type = ["cdylib", "rlib"]

# Rust 1.99 emits bulk-memory and saturating float-to-int operations; the
# binaryen bundled with wasm-pack 0.15.0 rejects them unless the features are
# enabled explicitly.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]

[dependencies]
duty2cal-core = { path = "../../crates/duty2cal-core" }
duty2cal-pdf = { path = "../../crates/duty2cal-pdf" }
time = "0.3"

# Browser-only bindings: the native workspace builds (fmt, clippy, the Windows
# GNU build) never pull these crates.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
duty2cal-pdf-fixtures = { path = "../../crates/duty2cal-pdf-fixtures" }
