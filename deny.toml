# SPDX-License-Identifier: MPL-2.0
# cargo-deny policy (see docs/arc42/adr/ADR-0001-project-license.md).
[licenses]
allow = [
  "MIT", "Apache-2.0",
  "BSD-3-Clause", "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
]
# Dev-only licences (e.g. BlueOak-1.0.0 via cucumber-codegen -> synthez) are not
# part of cargo-deny's default graph; `cargo about` does include them.
# Workspace crates are exempt from the allowlist; third-party crates must match.
# Any GPL/LGPL/AGPL/SSPL third-party crate is a hard failure.
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# `pdfplumber` may only be depended on by `duty2cal-pdf`.
[[bans.deny]]
name = "pdfplumber"
wrappers = ["duty2cal-pdf"]
