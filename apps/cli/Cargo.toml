[package]
name = "duty2cal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
duty2cal-core = { path = "../../crates/duty2cal-core" }
duty2cal-pdf = { path = "../../crates/duty2cal-pdf" }
time = "0.3"

[dev-dependencies]
cucumber = "0.23"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[[test]]
name = "features_runner"
harness = false
