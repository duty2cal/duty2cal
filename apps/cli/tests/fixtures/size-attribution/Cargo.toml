# SPDX-License-Identifier: MPL-2.0
[workspace]
members = ["app", "support"]
resolver = "2"

[profile.release]
opt-level = "z"
# LTO is omitted: the fixture's whole purpose is that the function symbol
# survives for the crate/function split. design.md's risk records this as the
# reviewed fallback ("drops lto") when a toolchain internalises the symbol.
lto = false
strip = true
codegen-units = 1
